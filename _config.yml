# HAIEF - Human & AI ElevAItion Foundation
# Public Movement Website Configuration

title: "HAIEF"
tagline: "Keeping Open Source AI Open"
description: "The Human & AI ElevAItion Foundation - Building open governance standards for human-safe, community-driven AI"
url: "https://neurolift-technologies.github.io"
baseurl: "/haief"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Theme settings
remote_theme: null

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md
  - frameworks/
  - specs/
  - docs/
  - tests/
  - community/
  - internal/

# Include these files
include:
  - _pages

# Collections for organized content
collections:
  frameworks:
    output: true
    permalink: /framework/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Social and organization links
social:
  github: "https://github.com/NeuroLift-Technologies/haief"
  discussions: "https://github.com/NeuroLift-Technologies/haief/discussions"

# Organization info
organization:
  name: "Human & AI ElevAItion Foundation"
  founding_org: "NeuroLift Technologies LLC"
  founder: "Joshua Wayne Dorsey Sr."

# Navigation
nav:
  - title: "Home"
    url: "/"
  - title: "The Problem"
    url: "/the-problem/"
  - title: "Who We Are"
    url: "/who-we-are/"
  - title: "Solidarity Framework"
    url: "/solidarity-framework/"
  - title: "Take Action"
    url: "/take-action/"
  - title: "Q&A"
    url: "/questions-and-answers/"
  - title: "For Humans"
    url: "/for-humans/"
  - title: "For AI Agents"
    url: "/for-agents/"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
